name: Keep API awake

# Render's free tier sleeps after ~15 idle minutes. A light ping every 14 minutes
# keeps the live demo fast for recruiters. Set the repository variable
# API_HEALTH_URL (Settings > Secrets and variables > Actions > Variables) to the API URL.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.API_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health endpoint
        run: curl -fsS --max-time 90 "${{ vars.API_HEALTH_URL }}" > /dev/null
